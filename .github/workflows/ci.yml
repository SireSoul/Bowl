name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# A newer push to the same branch makes older runs pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        preset: [dev, release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages (SDL3 is built from source)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxss-dev libxfixes-dev libxtst-dev libwayland-dev libxkbcommon-dev wayland-protocols libegl1-mesa-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libdbus-1-dev libudev-dev

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DPH_FETCH_SDL=ON -DPH_WARNINGS_AS_ERRORS=${{ runner.os != 'Windows' && 'ON' || 'OFF' }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 4

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      # Windows runners have no GPU, but D3D12 can run on WARP (Microsoft's software rasterizer): run the isometric
      # sample on it and keep the screenshot, so the D3D12 path is exercised end to end.
      - name: Smoke run on Direct3D 12
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter isometric.exe build/${{ matrix.preset }}/samples | Select-Object -First 1
          & $exe.FullName --driver direct3d12 --night --frames 30 --screenshot "$PWD/d3d12-${{ matrix.preset }}.png"
          if (-not (Test-Path "d3d12-${{ matrix.preset }}.png")) { exit 1 }

      - name: Upload screenshot
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: d3d12-${{ matrix.preset }}
          path: d3d12-${{ matrix.preset }}.png
          if-no-files-found: warn
