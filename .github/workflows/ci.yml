name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch: # the Run workflow button on the Actions tab

# A newer push to the same branch makes older runs pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        preset: [dev, release]
    runs-on: ${{ matrix.os }}
    # Jobs take a few minutes (the Windows hot reload check can wait up to 15); anything stuck stops here, not at 6 h.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages (SDL3 is built from source)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxss-dev libxfixes-dev libxtst-dev libwayland-dev libxkbcommon-dev wayland-protocols libegl1-mesa-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libdbus-1-dev libudev-dev

      # Compiler cache (Linux/macOS): unchanged sources, including all of SDL/glslang/SPIRV-Cross, compile from cache.
      - name: ccache
        if: runner.os != 'Windows'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-${{ matrix.preset }}
          max-size: 500M

      - name: Configure
        shell: bash
        run: |
          launcher=""
          if [ "$RUNNER_OS" != "Windows" ]; then
            launcher="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
          fi
          # The optional parts (Box2D, Tracy) are built in dev, so they keep compiling everywhere.
          optional=""
          if [ "${{ matrix.preset }}" = "dev" ]; then optional="-DBOWL_BOX2D=ON -DBOWL_TRACY=ON -DBOWL_OPUS=ON"; fi
          cmake --preset ${{ matrix.preset }} -DBOWL_FETCH_SDL=ON \
            -DBOWL_WARNINGS_AS_ERRORS=${{ runner.os != 'Windows' && 'ON' || 'OFF' }} $launcher $optional

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 4

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      # Windows runners have no GPU, but D3D12 can run on WARP (Microsoft's software rasterizer): run the isometric
      # sample on it and keep the screenshot, so the D3D12 path is exercised end to end.
      - name: Smoke run on Direct3D 12
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter isometric.exe build/${{ matrix.preset }}/samples | Select-Object -First 1
          & $exe.FullName --driver direct3d12 --night --frames 30 --screenshot "$PWD/d3d12-${{ matrix.preset }}.png"
          if (-not (Test-Path "d3d12-${{ matrix.preset }}.png")) { exit 1 }

      # Game-code hot reload end to end: run the sprites sample, save its source, and wait for the game to rebuild
      # its code library and swap it in.
      - name: Hot reload on Windows
        if: runner.os == 'Windows' && matrix.preset == 'dev'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter sprites.exe build/dev/samples | Select-Object -First 1
          $game = Start-Process $exe.FullName -ArgumentList '--driver','direct3d12','--frames','1000000' `
            -RedirectStandardOutput hot.log -RedirectStandardError hot.err -NoNewWindow -PassThru
          function Wait-Log($pattern, $seconds) {
            $deadline = (Get-Date).AddSeconds($seconds)
            while ((Get-Date) -lt $deadline) {
              if ((Test-Path hot.log) -and (Select-String -Path hot.log -Pattern $pattern -Quiet)) { return $true }
              if ($game.HasExited) { return $false }
              Start-Sleep -Seconds 1
            }
            return $false
          }
          $ok = Wait-Log 'auto-build: .* watched' 120
          if ($ok) {
            (Get-Item samples/sprites/main.cpp).LastWriteTime = Get-Date
            $ok = Wait-Log 'hot reload #1' 900
          }
          if (-not $game.HasExited) { Stop-Process -Id $game.Id }
          Get-Content hot.log, hot.err -ErrorAction SilentlyContinue
          if (-not $ok) { exit 1 }

      - name: Upload screenshot
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: d3d12-${{ matrix.preset }}
          path: d3d12-${{ matrix.preset }}.png
          if-no-files-found: warn

  # Each fuzzer (tests/fuzz) for 20 seconds on top of what earlier runs found, which the cache carries over. Short, so
  # it catches a parser change that breaks on a known input or falls over within seconds; long runs are for
  # tests/fuzz/run.sh on a machine of your own (CONTRIBUTING.md).
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages (SDL3 is built from source; libFuzzer comes with Clang's runtime libraries)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-18 libclang-rt-18-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxss-dev libxfixes-dev libxtst-dev libwayland-dev libxkbcommon-dev \
            wayland-protocols libegl1-mesa-dev libasound2-dev libpulse-dev libdbus-1-dev libudev-dev

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ubuntu-24.04-fuzz
          max-size: 500M

      - name: Corpus from earlier runs
        uses: actions/cache@v4
        with:
          path: build/fuzz/fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      - name: Configure and build the fuzzers
        run: |
          cmake --preset fuzz -G Ninja -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 \
            -DBOWL_DEV_TOOLS=OFF -DBOWL_BUILD_TESTS=OFF -DBOWL_FETCH_SDL=ON -DBOWL_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build/fuzz --target bowl_fuzz --parallel 4

      - name: Fuzz
        run: tests/fuzz/run.sh build/fuzz 20

      - name: Upload what was found
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            build/fuzz/fuzz/crashes
            build/fuzz/fuzz/*.log
          if-no-files-found: ignore
